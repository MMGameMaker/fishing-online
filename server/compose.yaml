name: fishing-online-dev
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: fishing_online
      POSTGRES_USER: fishing_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishing_dev -d fishing_online"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:

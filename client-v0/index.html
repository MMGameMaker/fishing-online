<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fishing Online</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="game"></div>

      <div id="hud">
        <div id="hud-player">
          <span id="hud-name"></span>
          <span class="hud-chip hud-chip-level">
            <svg class="chip-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.2l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="#8fe9ff"/></svg>
            <span id="hud-level"></span>
          </span>
          <span class="hud-chip hud-chip-coins">
            <svg class="chip-icon" viewBox="0 0 16 16" aria-hidden="true">
              <circle cx="8" cy="8" r="6.5" fill="#ffd65a" stroke="#b8862a" stroke-width="1.4" />
              <circle cx="8" cy="8" r="4.3" fill="none" stroke="#b8862a" stroke-width="0.8" />
            </svg>
            <span id="hud-coins"></span>
          </span>
          <span class="hud-chip hud-chip-room" id="hud-room"></span>
        </div>
        <div id="hud-buttons">
          <button id="btn-menu" type="button">Menu</button>
          <button id="btn-look" type="button">Look (C)</button>
          <button id="btn-bag" type="button">Bag (B)</button>
          <button id="btn-quests" type="button">Quests (Q)</button>
          <button id="btn-dm" type="button">Messages (M)<span id="dm-badge" hidden></span></button>
        </div>
      </div>

      <div id="toasts"></div>

      <div id="fish-tip" hidden>
        <strong id="fish-tip-title"></strong>
        <p id="fish-tip-text"></p>
        <button id="fish-tip-ok" class="primary" type="button">OK, got it</button>
      </div>

      <div id="chat">
        <div id="chat-log"></div>
        <form id="chat-form">
          <input id="chat-input" maxlength="120" autocomplete="off" placeholder="Press Enter to chat" />
          <button id="chat-send" class="icon-btn" type="submit" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5l17.5-8-7 17.5-2.3-7.2-7.2-2.3z" /></svg>
          </button>
        </form>
      </div>

      <!-- Covers the game while the player creates their character on entry (see initLook). -->
      <div id="look-backdrop" hidden></div>
      <section id="look-panel" class="panel" hidden>
        <header><h2 id="look-title">Change look</h2><button class="close" type="button" data-close="look-panel">×</button></header>
        <div class="look-body">
          <div class="look-preview">
            <div id="look-canvas"></div>
            <button id="look-rotate" type="button">Rotate</button>
            <div class="look-row">
              <label>Skin</label>
              <div id="look-skin"></div>
            </div>
          </div>
          <div id="look-options">
            <div id="look-tabs" class="look-tabs" role="tablist"></div>
            <div id="look-grid" class="look-grid"></div>
            <div id="look-colors" class="look-row"></div>
          </div>
        </div>
        <footer>
          <button id="look-random" type="button">Randomize</button>
          <button id="look-save" class="primary" type="button">Save</button>
        </footer>
      </section>

      <section id="bag-panel" class="panel" hidden>
        <header><h2>Bag</h2><button class="close" type="button" data-close="bag-panel">×</button></header>
        <div id="bag-list"></div>
        <footer>
          <span id="bag-total"></span>
          <button id="bag-sell-all" class="primary" type="button">Sell all</button>
        </footer>
      </section>

      <section id="menu-panel" class="panel" hidden>
        <header><h2>Menu</h2><button class="close" type="button" data-close="menu-panel">×</button></header>
        <div id="menu-body" class="menu-body">
          <button id="menu-look" type="button">Change look</button>
          <button id="menu-bag" type="button">Bag</button>
          <button id="menu-quests" type="button">Quests</button>
          <button id="menu-dm" type="button">Messages</button>
          <button id="menu-friends" type="button">Friends</button>
          <button id="menu-shop" type="button">Shop</button>
          <button id="menu-fishlog" type="button">Fish logbook</button>
          <button id="menu-dance" type="button">Dance (X)</button>
        </div>
        <footer>
          <span id="menu-profile"></span>
        </footer>
      </section>

      <section id="quest-panel" class="panel" hidden>
        <header><h2>Quests</h2><button class="close" type="button" data-close="quest-panel">×</button></header>
        <div id="quest-list"></div>
      </section>

      <section id="friends-panel" class="panel" hidden>
        <header><h2>Friends</h2><button class="close" type="button" data-close="friends-panel">×</button></header>
        <div id="friends-list"></div>
        <footer>
          <input id="friends-add-input" maxlength="20" autocomplete="off" placeholder="Username to add" />
          <button id="friends-add-btn" class="primary" type="button">Add</button>
        </footer>
      </section>

      <section id="shop-panel" class="panel" hidden>
        <header><h2>Tinkerbean — Rod Shop</h2><button class="close" type="button" data-close="shop-panel">×</button></header>
        <div id="shop-list"></div>
        <footer><span id="shop-coins"></span></footer>
      </section>

      <section id="fishlog-panel" class="panel" hidden>
        <header><h2>Fish Logbook</h2><button class="close" type="button" data-close="fishlog-panel">×</button></header>
        <div id="fishlog-list"></div>
      </section>

      <div id="npc-panel" class="panel" hidden>
        <header><h2 id="npc-name"></h2><button id="npc-close" class="close" type="button">×</button></header>
        <div class="npc-body"><img id="npc-portrait" hidden><p id="npc-text"></p></div>
        <footer><button id="npc-action" class="primary" type="button" hidden></button></footer>
      </div>

      <section id="dm-panel" class="panel" hidden>
        <header><h2>Messages</h2><button class="close" type="button" data-close="dm-panel">×</button></header>
        <div class="dm-body">
          <div id="dm-contacts"></div>
          <div class="dm-thread">
            <div id="dm-title">Choose a contact</div>
            <div id="dm-messages"></div>
            <form id="dm-form"><input id="dm-input" maxlength="300" autocomplete="off" placeholder="Write a message" disabled /><button class="primary" type="submit">Send</button></form>
          </div>
        </div>
      </section>

      <div id="login">
        <div class="screen-logo-zone"><img class="screen-logo" src="/login/logo.png" alt="Fishing Online" /></div>
        <div id="login-card">
          <div id="login-card-title">
            <span class="login-ornament">✦</span>
            <h2>Đăng nhập</h2>
            <span class="login-ornament">✦</span>
          </div>
          <div id="login-divider"></div>
          <button id="login-google" type="button">
            <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33z"/>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
            </svg>
            <span>Đăng nhập bằng Google</span>
          </button>
          <p id="login-tagline">Bạn có thể câu được cá lớn cỡ nào?</p>
          <p id="login-error" hidden></p>
        </div>
      </div>

      <div id="loading" hidden>
        <div class="screen-logo-zone"><img class="screen-logo" src="/login/logo.png" alt="Fishing Online" /></div>
        <div id="loading-progress">
          <div id="loading-status">Đang tải... <span id="loading-percent">0%</span></div>
          <div id="loading-bar"><div id="loading-fill"><span id="loading-fill-fish">🐟</span></div></div>
          <p id="loading-tip"></p>
        </div>
      </div>

      <div id="fatal" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

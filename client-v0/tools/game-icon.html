<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
<style>body{margin:0;background:#222}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="512" height="512"></canvas>
<script>
const S = 512;
const c = document.getElementById('c');
const g = c.getContext('2d');
const load = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };

async function main() {
  await document.fonts.load('100px "Lilita One"');
  const [fish, body, bodyJson, rod, rodJson] = await Promise.all([
    load('/assets/fish/CaChuoi.png'),
    load('/assets/characters/skin_02.png'),
    fetch('/assets/characters/skin_02.json').then((r) => r.json()),
    load('/assets/rods/rod_bliss.png'),
    fetch('/assets/rods/rod_bliss.json').then((r) => r.json()),
  ]);

  // Bo góc.
  g.save();
  rr(0, 0, S, S, 78);
  g.clip();

  // Trời.
  let sky = g.createLinearGradient(0, 0, 0, 300);
  sky.addColorStop(0, '#2f8fe8');
  sky.addColorStop(1, '#a9e4ff');
  g.fillStyle = sky;
  g.fillRect(0, 0, S, S);
  // Quầng sáng mặt trời góc phải trên.
  const sun = g.createRadialGradient(440, 70, 4, 440, 70, 170);
  sun.addColorStop(0, 'rgba(255,255,230,0.95)');
  sun.addColorStop(1, 'rgba(255,255,230,0)');
  g.fillStyle = sun;
  g.fillRect(0, 0, S, S);
  // Mây pixel.
  g.imageSmoothingEnabled = false;
  g.fillStyle = 'rgba(255,255,255,0.92)';
  for (const [x, y, w] of [[18, 150, 84], [40, 130, 44], [380, 168, 80], [396, 150, 40]]) { g.fillRect(x, y, w, 18); }

  // Bờ xa: đồi và cây.
  g.fillStyle = '#5db85a';
  g.beginPath(); g.ellipse(70, 262, 150, 46, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(430, 266, 170, 52, 0, 0, Math.PI * 2); g.fill();
  const tree = (x, y, s) => {
    g.fillStyle = '#7b5230'; g.fillRect(x - 3 * s, y - 14 * s, 6 * s, 16 * s);
    g.fillStyle = '#2f8f3a'; g.beginPath(); g.arc(x, y - 26 * s, 17 * s, 0, 7); g.fill();
    g.fillStyle = '#58c256'; g.beginPath(); g.arc(x - 5 * s, y - 31 * s, 11 * s, 0, 7); g.fill();
  };
  tree(40, 262, 1.5); tree(98, 270, 1.2); tree(470, 262, 1.6); tree(410, 272, 1.1); tree(250, 256, 0.9);

  // Hồ nước.
  const lake = g.createLinearGradient(0, 262, 0, S);
  lake.addColorStop(0, '#47b6f3');
  lake.addColorStop(1, '#1b6fd0');
  g.fillStyle = lake;
  g.fillRect(0, 262, S, S - 262);
  g.fillStyle = 'rgba(255,255,255,0.35)';
  for (let y = 290; y < S; y += 26) for (let x = ((y / 26) % 2) * 30; x < S; x += 70) g.fillRect(x, y, 34, 3);

  // Cá lớn nhảy lên bên phải (xoay chếch lên), kèm bọt nước.
  const splash = (x, y, r) => {
    const gr = g.createRadialGradient(x, y, 2, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.98)');
    gr.addColorStop(1, 'rgba(210,240,255,0.0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  };
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.save();
  g.translate(372, 292);
  g.rotate(0.5);
  const fw = 280, fh = fw * fish.height / fish.width;
  g.shadowColor = 'rgba(0,30,90,0.35)'; g.shadowBlur = 14; g.shadowOffsetY = 8;
  g.drawImage(fish, -fw / 2, -fh / 2, fw, fh);
  g.restore();
  g.shadowColor = 'transparent';
  for (const [x, y, r] of [[330, 392, 52], [388, 400, 46], [440, 378, 38], [290, 410, 34], [470, 420, 30], [360, 430, 40]]) splash(x, y, r);
  g.fillStyle = '#ffffff';
  for (const [x, y, r] of [[300, 360, 5], [320, 340, 4], [415, 352, 6], [450, 335, 4], [470, 392, 5], [286, 380, 4], [350, 345, 3]]) { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }

  // Thuyền gỗ ở góc trái dưới, thỏ ngồi cầm cần (art thật của game, nét pixel).
  g.fillStyle = '#9a6330';
  g.beginPath(); g.moveTo(-10, 452); g.lineTo(250, 452); g.lineTo(220, 520); g.lineTo(-10, 520); g.closePath(); g.fill();
  g.fillStyle = '#c0864a'; g.fillRect(-10, 440, 262, 14);
  g.fillStyle = '#6d4220'; for (let x = 20; x < 250; x += 52) g.fillRect(x, 458, 3, 60);
  const frame = (json, name) => json.frames[name].frame;
  const bf = frame(bodyJson, 'wait_down_0');
  const rf = frame(rodJson, 'wait_down_0');
  const CX = 20, CY = 22, CW = 80, CH = 64; // vùng cắt quanh thân và cần trong khung 120×140
  const Z = 5.6;
  const dx = -50, dy = 160;
  g.imageSmoothingEnabled = false;
  g.drawImage(body, bf.x + CX, bf.y + CY, CW, CH, dx, dy, CW * Z, CH * Z);
  // Mũ rơm bé xíu trên đầu thỏ (vẽ tay).
  g.imageSmoothingEnabled = true;

  // Tiêu đề: "Fishing" cam vàng viền xanh, "Online" trắng viền xanh, bóng đổ.
  g.textAlign = 'center';
  g.lineJoin = 'round';
  g.font = '112px "Lilita One"';
  const title = (text, x, y, size, fillTop, fillBot, outline) => {
    g.font = `${size}px "Lilita One"`;
    g.lineWidth = size * 0.2;
    g.strokeStyle = '#0b2a6b';
    g.strokeText(text, x, y + 8);
    g.lineWidth = size * 0.16;
    g.strokeStyle = outline;
    g.strokeText(text, x, y);
    const f = g.createLinearGradient(0, y - size * 0.8, 0, y);
    f.addColorStop(0, fillTop); f.addColorStop(1, fillBot);
    g.fillStyle = f;
    g.fillText(text, x, y);
  };
  title('Fishing', 256, 108, 112, '#ffe45e', '#ff9d1c', '#ffffff');
  title('Online', 256, 192, 92, '#ffffff', '#cfe9ff', '#1f6fd6');

  g.restore();
  // Viền mỏng quanh góc bo.
  g.strokeStyle = 'rgba(10,40,100,0.9)'; g.lineWidth = 6;
  rr(3, 3, S - 6, S - 6, 76); g.stroke();

  const blob = await new Promise((ok) => c.toBlob(ok, 'image/png'));
  const r = await fetch('http://localhost:5199/save', { method: 'POST', body: blob });
  document.title = 'saved ' + (await r.text());
}
main().catch((e) => { document.title = 'error ' + e; console.error(e); });
</script>
</body>
</html>

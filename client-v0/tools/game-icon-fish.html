<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="c" width="512" height="512"></canvas>
<script>
const N = 128, SC = 4;
const out = document.getElementById('c');
const og = out.getContext('2d');
const load = (src) => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = src; });
const rnd = (() => { let s = 12345; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); })();

async function main() {
  await document.fonts.load('100px "Lilita One"');
  const ref = await load('/ref.jpg');

  // 1) Ảnh mẫu → lưới 128×128, giảm màu 7 mức mỗi kênh.
  const sc = document.createElement('canvas'); sc.width = N; sc.height = N;
  const sg = sc.getContext('2d', { willReadFrequently: true });
  sg.imageSmoothingEnabled = true; sg.imageSmoothingQuality = 'high';
  sg.drawImage(ref, 0, 0, N, N);
  const raw = sg.getImageData(0, 0, N, N).data;
  const L = 7;
  const C = new Array(N * N);
  for (let p = 0; p < N * N; p++) {
    const c = [0, 1, 2].map((k) => {
      let v = raw[p * 4 + k] / 255;
      v = Math.min(1, Math.max(0, (v - 0.5) * 1.12 + 0.5));
      return Math.round(Math.round(v * (L - 1)) * 255 / (L - 1));
    });
    C[p] = c;
  }
  const S = C.map((c) => c.slice()); // bản gốc (để dán cá)

  // 2) Mặt nạ vùng cần bỏ: người, cần câu, dây, tiêu đề, cá gốc, bọt nước gốc, góc đen.
  const mask = new Uint8Array(N * N);
  const poly = (pts, x, y) => { let c = false; for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) { const [xi, yi] = pts[i], [xj, yj] = pts[j]; if ((yi > y) !== (yj > y) && x + 0.5 < ((xj - xi) * (y + 0.5 - yi)) / (yj - yi) + xi) c = !c; } return c; };
  const segDist = (px, py, ax, ay, bx, by) => { const dx = bx - ax, dy = by - ay; const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / (dx * dx + dy * dy || 1))); return Math.hypot(px - (ax + t * dx), py - (ay + t * dy)); };
  const boy = [[0, 38], [50, 38], [53, 60], [58, 76], [68, 84], [66, 98], [58, 102], [56, 118], [64, 128], [0, 128]];
  const rod = [[44, 102], [48, 90], [52, 78], [58, 66], [64, 56], [72, 48], [82, 43], [92, 41], [97, 46]];
  const line = [[92, 41], [86, 44], [81, 51]];
  const fishPoly = [[71, 63], [73, 56], [78, 50], [82, 46], [90, 45], [96, 47], [104, 50], [112, 55], [120, 62], [127, 66], [127, 102], [124, 108], [118, 117], [110, 121], [100, 119], [93, 115], [96, 108], [100, 100], [99, 94], [94, 90], [90, 84], [84, 77], [77, 71], [72, 67]];
  const isFoam = (x, y) => { const c = S[y * N + x]; return x >= 72 && y >= 93 && !(x < 84 && y >= 112) && c[0] > 140 && c[1] > 190 && c[2] > 200; };
  const near = (x, y, pts, r) => { for (let i = 0; i < pts.length - 1; i++) if (segDist(x, y, ...pts[i], ...pts[i + 1]) <= r) return true; return false; };
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    let m = poly(boy, x, y) || near(x, y, rod, 3.2) || near(x, y, line, 2) || (x >= 12 && x <= 118 && y <= 42);
    // Bỏ cá gốc (nới 2 ô) và bọt nước gốc, mẩu thuyền ở giữa dưới.
    if (!m) { for (let dy = -4; dy <= 4 && !m; dy++) for (let dx = -4; dx <= 4 && !m; dx++) if (poly(fishPoly, x + dx, y + dy)) m = true; }
    if (!m && (isFoam(x, y) || (x >= 58 && x <= 92 && y >= 108))) m = true;
    // Bốn góc đen của ảnh mẫu.
    const cx = x < 20 ? 20 : x > N - 21 ? N - 21 : x, cy = y < 20 ? 20 : y > N - 21 ? N - 21 : y;
    if (Math.hypot(x - cx, y - cy) > 19) m = true;
    mask[y * N + x] = m ? 1 : 0;
  }

  // 3) Vá vùng bỏ bằng ghép mảnh từ chính nền ảnh mẫu (Efros–Leung): chọn ô ngoài vùng bỏ có hàng xóm giống nhất, cùng độ cao.
  const known = new Uint8Array(N * N);
  for (let p = 0; p < N * N; p++) known[p] = mask[p] ? 0 : 1;
  const original = known.slice();
  const R = 2;
  const cands = [];
  for (let p = 0; p < N * N; p++) if (original[p]) cands.push(p);
  let remaining = N * N - cands.length;
  const nb = (x, y) => { let n = 0; for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) { const xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < N && yy < N && known[yy * N + xx]) n++; } return n; };
  while (remaining > 0) {
    // Ô chưa biết có nhiều hàng xóm đã biết nhất.
    let best = -1, bn = -1;
    for (let p = 0; p < N * N; p++) if (!known[p]) { const x = p % N, y = (p / N) | 0; const n = nb(x, y); if (n > bn) { bn = n; best = p; } }
    const x = best % N, y = (best / N) | 0;
    // Lấy mẫu ứng viên cùng độ cao.
    let bestScore = Infinity, bestC = null;
    for (let t = 0; t < 2600; t++) {
      const p = cands[(rnd() * cands.length) | 0];
      const sx = p % N, sy = (p / N) | 0;
      if (Math.abs(sy - y) > 12) continue;
      let ssd = 0, cnt = 0;
      for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
        const xx = x + dx, yy = y + dy, ax = sx + dx, ay = sy + dy;
        if (xx < 0 || yy < 0 || xx >= N || yy >= N || ax < 0 || ay < 0 || ax >= N || ay >= N) continue;
        if (!known[yy * N + xx] || !original[ay * N + ax]) continue;
        const a = C[yy * N + xx], b = S[ay * N + ax];
        ssd += (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2; cnt++;
      }
      if (cnt < 3) continue;
      const score = ssd / cnt + Math.abs(sy - y) * 20;
      if (score < bestScore) { bestScore = score; bestC = S[p]; }
    }
    C[best] = bestC ? bestC.slice() : [90, 170, 230];
    known[best] = 1;
    remaining--;
  }

  for (let pass = 0; pass < 2; pass++) {
    const next = C.map((c) => c.slice());
    for (let y = 1; y < N - 1; y++) for (let x = 1; x < N - 1; x++) {
      if (original[y * N + x]) continue;
      for (let k = 0; k < 3; k++) {
        const vals = [];
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) vals.push(C[(y + dy) * N + x + dx][k]);
        vals.sort((a, b) => a - b);
        next[y * N + x][k] = vals[4];
      }
    }
    for (let p = 0; p < N * N; p++) C[p] = next[p];
  }

  // 4) Dán cá và bọt nước gốc, dịch sang trái 35 ô để cá nằm chính giữa.
  const SHIFT = -35;
  const fishPix = []; // dán SAU chữ tiêu đề để cá nằm trên chữ Online
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    if (!(poly(fishPoly, x, y) || isFoam(x, y))) continue;
    const nx = x + SHIFT;
    if (nx < 0 || nx >= N) continue;
    fishPix.push([nx, y, S[y * N + x]]);
  }

  // 5) Vẽ ra canvas (phóng 4 lần).
  const dc = document.createElement('canvas'); dc.width = N; dc.height = N;
  const dg = dc.getContext('2d');
  const D = dg.createImageData(N, N);
  for (let p = 0; p < N * N; p++) { D.data[p * 4] = C[p][0]; D.data[p * 4 + 1] = C[p][1]; D.data[p * 4 + 2] = C[p][2]; D.data[p * 4 + 3] = 255; }
  dg.putImageData(D, 0, 0);
  og.imageSmoothingEnabled = false;
  og.drawImage(dc, 0, 0, N * SC, N * SC);

  // 6) Tiêu đề pixel "Fishing / Online".
  const q = (c) => c.map((v) => Math.round(Math.round((v / 255) * 6) * 255 / 6));
  const layer = (draw) => { const cv = document.createElement('canvas'); cv.width = 512; cv.height = 512; const cg = cv.getContext('2d', { willReadFrequently: true }); cg.textAlign = 'center'; cg.lineJoin = 'round'; draw(cg); return cg.getImageData(0, 0, 512, 512).data; };
  const lines = [['Fishing', 256, 104, 118, ['#ffe45e', '#ff9d1c']], ['Online', 256, 192, 96, ['#ffffff', '#bfe0ff']]];
  const outline = layer((cg) => { for (const [t, x, y, sz] of lines) { cg.font = `${sz}px "Lilita One"`; cg.lineWidth = sz * 0.26; cg.strokeStyle = '#0b2a6b'; cg.strokeText(t, x, y + 6); } });
  const fills = layer((cg) => { for (const [t, x, y, sz, [a, b]] of lines) { cg.font = `${sz}px "Lilita One"`; const gr = cg.createLinearGradient(0, y - sz * 0.8, 0, y); gr.addColorStop(0, a); gr.addColorStop(1, b); cg.fillStyle = gr; cg.fillText(t, x, y); } });
  const cellAvg = (buf, gx, gy) => { let r = 0, g = 0, b = 0, a = 0; for (let yy = 0; yy < SC; yy++) for (let xx = 0; xx < SC; xx++) { const i = ((gy * SC + yy) * 512 + gx * SC + xx) * 4; r += buf[i]; g += buf[i + 1]; b += buf[i + 2]; a += buf[i + 3]; } const n = SC * SC; return [r / n, g / n, b / n, a / n]; };
  for (let gy = 0; gy < N; gy++) for (let gx = 0; gx < N; gx++) {
    const o = cellAvg(outline, gx, gy);
    if (o[3] > 110) { og.fillStyle = '#0b2a6b'; og.fillRect(gx * SC, gy * SC, SC, SC); }
    const f = cellAvg(fills, gx, gy);
    if (f[3] > 140) { const c = q([f[0] * 255 / f[3], f[1] * 255 / f[3], f[2] * 255 / f[3]]); og.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; og.fillRect(gx * SC, gy * SC, SC, SC); }
  }

  // 6b) Cá và bọt nước dán lên trên chữ.
  for (const [x, y, c] of fishPix) { og.fillStyle = `rgb(${c[0]},${c[1]},${c[2]})`; og.fillRect(x * SC, y * SC, SC, SC); }

  // 7) Bo góc + viền.
  const Rr = 78;
  const tmp = document.createElement('canvas'); tmp.width = 512; tmp.height = 512;
  tmp.getContext('2d').drawImage(out, 0, 0);
  og.clearRect(0, 0, 512, 512);
  og.save(); og.beginPath(); og.moveTo(Rr, 0); og.arcTo(512, 0, 512, 512, Rr); og.arcTo(512, 512, 0, 512, Rr); og.arcTo(0, 512, 0, 0, Rr); og.arcTo(0, 0, 512, 0, Rr); og.closePath(); og.clip();
  og.drawImage(tmp, 0, 0);
  og.restore();
  og.strokeStyle = 'rgba(10,40,100,0.95)'; og.lineWidth = 8;
  og.beginPath(); og.moveTo(Rr + 4, 4); og.arcTo(508, 4, 508, 508, Rr - 4); og.arcTo(508, 508, 4, 508, Rr - 4); og.arcTo(4, 508, 4, 4, Rr - 4); og.arcTo(4, 4, 508, 4, Rr - 4); og.closePath(); og.stroke();

  const blob = await new Promise((ok) => out.toBlob(ok, 'image/png'));
  const r = await fetch('http://localhost:5199/save', { method: 'POST', body: blob });
  document.title = 'saved ' + (await r.text());
}
main().catch((e) => { document.title = 'error ' + e; console.error(e); });
</script></body></html>

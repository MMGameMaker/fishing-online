<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fishing Pier</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* Khung chơi giữ tỉ lệ 16:9, to nhất có thể giữa cửa sổ; phần thừa là nền đen. */
      #game {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
      }
      #hint {
        position: fixed;
        left: 8px;
        bottom: 8px;
        color: #e8e2c8;
        font: 12px/1.4 system-ui, sans-serif;
        background: rgb(0 0 0 / 0.45);
        padding: 4px 8px;
        border-radius: 4px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hint">WASD / mũi tên: di chuyển · F cạnh ghế: ngồi câu cá</div>
    <script type="module" src="/src/online/scenes/pier/preview.ts"></script>
  </body>
</html>

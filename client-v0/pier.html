<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fishing Pier</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      /* Khung chơi giữ tỉ lệ 16:9, to nhất có thể giữa cửa sổ; phần thừa là nền đen. */
      #game {
        position: fixed;
        inset: 0;
        margin: auto;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
      }
    </style>
  </head>
  <!-- page-pier: style riêng của trang này (scenes/pier/pier.css). Bỏ dòng gợi ý phím (feedback 2026-11-14). -->
  <body class="page-pier">
    <div id="game"></div>
    <script type="module" src="/src/online/scenes/pier/preview.ts"></script>
  </body>
</html>
